<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" role="img" aria-labelledby="t-write-around d-write-around" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t-write-around">Write-around diagram</title><desc id="d-write-around">The application writes directly to the database (1), bypassing the cache. The cache is updated asynchronously afterwards (2).</desc><defs><marker id="ah-write-around" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs><rect x="1" y="1" width="598" height="288" rx="14" fill="#ffffff" stroke="#d1d5db"/><rect x="40" y="70" width="130" height="56" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="105.0" y="103.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Application</text><rect x="435" y="70" width="50" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><rect x="443" y="79" width="34" height="10" rx="2" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><circle cx="471" cy="84" r="2" fill="#047857"/><rect x="443" y="94" width="34" height="10" rx="2" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><circle cx="471" cy="99" r="2" fill="#047857"/><rect x="443" y="109" width="34" height="10" rx="2" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><circle cx="471" cy="114" r="2" fill="#047857"/><text x="460" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Database</text><path d="M170 98 H428" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-write-around)"/><text x="299" y="90" text-anchor="middle" font-size="13" fill="#111827"><tspan x="299" dy="0">1. Write to database</tspan></text><path d="M460 152 V206" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah-write-around)"/><text x="448" y="178" text-anchor="end" font-size="13" fill="#111827"><tspan x="448" dy="0">2. Asynchronously</tspan><tspan x="448" dy="16">write to cache</tspan></text><rect x="400" y="210" width="120" height="52" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="460.0" y="241.0" text-anchor="middle" font-size="15" font-weight="600" fill="#78350f">Cache</text></svg>
