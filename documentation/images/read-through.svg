<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t-read-through d-read-through" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t-read-through">Read-through diagram</title><desc id="d-read-through">The application reads only from the cache (1). On a miss the cache itself gets the data from the database and updates itself (2) before returning it.</desc><defs><marker id="ah-read-through" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs><rect x="1" y="1" width="598" height="338" rx="14" fill="#ffffff" stroke="#d1d5db"/><rect x="30" y="110" width="130" height="56" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="95.0" y="143.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Application</text><rect x="400" y="110" width="120" height="56" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="460.0" y="143.0" text-anchor="middle" font-size="15" font-weight="600" fill="#78350f">Cache</text><path d="M160 138 H396" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-read-through)"/><text x="278" y="130" text-anchor="middle" font-size="13" fill="#111827"><tspan x="278" dy="0">1. Read from cache</tspan></text><path d="M424 170 L346 258" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-read-through)"/><path d="M346 282 L452 170" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-read-through)"/><text x="440" y="206" text-anchor="start" font-size="13" fill="#111827"><tspan x="440" dy="0">2. If not in cache, get</tspan><tspan x="440" dy="16">from DB, update cache</tspan></text><rect x="290" y="252" width="50" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><rect x="298" y="261" width="34" height="10" rx="2" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><circle cx="326" cy="266" r="2" fill="#047857"/><rect x="298" y="276" width="34" height="10" rx="2" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><circle cx="326" cy="281" r="2" fill="#047857"/><rect x="298" y="291" width="34" height="10" rx="2" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><circle cx="326" cy="296" r="2" fill="#047857"/><text x="315" y="328" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Database</text></svg>
