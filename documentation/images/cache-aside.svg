<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" role="img" aria-labelledby="t-cache-aside d-cache-aside" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t-cache-aside">Cache-aside diagram</title><desc id="d-cache-aside">The application checks the cache (1). On a hit it returns the data (2a). On a miss it reads the database (2b), updates the cache (3) and returns the data (4).</desc><defs><marker id="ah-cache-aside" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs><rect x="1" y="1" width="598" height="348" rx="14" fill="#ffffff" stroke="#d1d5db"/><rect x="150" y="150" width="130" height="56" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="215.0" y="183.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Application</text><rect x="420" y="50" width="120" height="52" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="480.0" y="81.0" text-anchor="middle" font-size="15" font-weight="600" fill="#78350f">Cache</text><path d="M230 150 V62 H416" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-cache-aside)"/><text x="240" y="55" text-anchor="start" font-size="13" fill="#111827"><tspan x="240" dy="0">1. Check if data in cache</tspan></text><path d="M262 150 V92 H416" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-cache-aside)"/><text x="272" y="86" text-anchor="start" font-size="13" fill="#111827"><tspan x="272" dy="0">3. Update cache</tspan></text><path d="M150 170 H14" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-cache-aside)"/><text x="14" y="162" text-anchor="start" font-size="13" fill="#111827"><tspan x="14" dy="0">2a. If yes, return</tspan></text><path d="M150 196 H14" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-cache-aside)"/><text x="14" y="214" text-anchor="start" font-size="13" fill="#111827"><tspan x="14" dy="0">4. Return</tspan></text><path d="M215 206 V290 H444" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-cache-aside)"/><text x="228" y="282" text-anchor="start" font-size="13" fill="#111827"><tspan x="228" dy="0">2b. If no, get from database</tspan></text><rect x="450" y="262" width="50" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><rect x="458" y="271" width="34" height="10" rx="2" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><circle cx="486" cy="276" r="2" fill="#047857"/><rect x="458" y="286" width="34" height="10" rx="2" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><circle cx="486" cy="291" r="2" fill="#047857"/><rect x="458" y="301" width="34" height="10" rx="2" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><circle cx="486" cy="306" r="2" fill="#047857"/><text x="475" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Database</text></svg>
