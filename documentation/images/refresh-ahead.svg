<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t-refresh-ahead d-refresh-ahead" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t-refresh-ahead">Refresh-ahead diagram</title><desc id="d-refresh-ahead">The application reads from the cache (1) and gets the value back at once (2). If the entry has passed the refresh-ahead factor, the cache asynchronously reloads it from the database (3).</desc><defs><marker id="ah-refresh-ahead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs><rect x="1" y="1" width="598" height="338" rx="14" fill="#ffffff" stroke="#d1d5db"/><rect x="100" y="120" width="130" height="56" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="165.0" y="153.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Application</text><rect x="400" y="120" width="120" height="56" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="460.0" y="153.0" text-anchor="middle" font-size="15" font-weight="600" fill="#78350f">Cache</text><path d="M230 148 H396" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-refresh-ahead)"/><text x="313" y="140" text-anchor="middle" font-size="13" fill="#111827"><tspan x="313" dy="0">1. Read from cache</tspan></text><path d="M100 148 H14" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-refresh-ahead)"/><text x="14" y="140" text-anchor="start" font-size="13" fill="#111827"><tspan x="14" dy="0">2. Return</tspan></text><path d="M430 180 V264 H246" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah-refresh-ahead)"/><path d="M246 296 H470 V180" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah-refresh-ahead)"/><text x="338" y="202" text-anchor="middle" font-size="13" fill="#111827"><tspan x="338" dy="0">3. If exceeds</tspan><tspan x="338" dy="16">refresh-ahead factor,</tspan><tspan x="338" dy="16">asynchronously refresh</tspan><tspan x="338" dy="16">data in cache</tspan></text><rect x="190" y="252" width="50" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><rect x="198" y="261" width="34" height="10" rx="2" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><circle cx="226" cy="266" r="2" fill="#047857"/><rect x="198" y="276" width="34" height="10" rx="2" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><circle cx="226" cy="281" r="2" fill="#047857"/><rect x="198" y="291" width="34" height="10" rx="2" fill="#ffffff" stroke="#047857" stroke-width="1.5"/><circle cx="226" cy="296" r="2" fill="#047857"/><text x="215" y="328" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Database</text></svg>
