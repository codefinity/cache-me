<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937">
  <title>CacheMe component diagram</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="810" fill="#ffffff"/>

  <!-- Library boundary -->
  <rect x="200" y="20" width="580" height="520" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="212" y="42" font-weight="600">CacheMe library</text>

  <!-- Outside the library -->
  <g fill="#f3f4f6" stroke="#6b7280">
    <rect x="20" y="60" width="150" height="180"/>
    <rect x="810" y="170" width="165" height="70"/>
    <rect x="225" y="600" width="530" height="60"/>
    <rect x="400" y="715" width="170" height="50"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="95" y="140">Client application</text>
    <text x="892" y="210">Redis</text>
    <text x="490" y="628">Application's loaders, writers</text>
    <text x="490" y="646">and dead-letter handler</text>
    <text x="485" y="745">Database</text>
  </g>
  <text x="95" y="160" text-anchor="middle">Program.cs and</text>
  <text x="95" y="178" text-anchor="middle">repositories</text>

  <!-- Inside the library -->
  <g fill="#dbeafe" stroke="#1d4ed8">
    <rect x="225" y="60" width="160" height="60"/>
    <rect x="420" y="60" width="150" height="60"/>
    <rect x="605" y="60" width="150" height="60"/>
    <rect x="225" y="170" width="160" height="70"/>
    <rect x="605" y="170" width="150" height="70"/>
    <rect x="280" y="330" width="105" height="60"/>
    <rect x="420" y="265" width="150" height="60"/>
    <rect x="420" y="350" width="150" height="60"/>
    <rect x="605" y="300" width="150" height="70"/>
    <rect x="420" y="450" width="150" height="60"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="305" y="95">Registration</text>
    <text x="495" y="95">Options validator</text>
    <text x="680" y="95">Redis startup check</text>
    <text x="305" y="200">Cache&lt;T&gt;</text>
    <text x="680" y="210">Redis store</text>
    <text x="332" y="356">Background</text>
    <text x="332" y="373">work</text>
    <text x="495" y="300">JSON serializer</text>
    <text x="495" y="385">Metrics</text>
    <text x="680" y="340">Write-behind processor</text>
    <text x="495" y="485">Write-behind service</text>
  </g>
  <text x="305" y="220" text-anchor="middle">with one load per key</text>

  <!-- Arrows -->
  <g fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)">
    <path d="M170 90 H225"/>
    <path d="M170 205 H225"/>
    <path d="M385 90 H420"/>
    <path d="M680 120 V170"/>
    <path d="M385 205 H605"/>
    <path d="M755 205 H810"/>
    <path d="M245 240 V600"/>
    <path d="M310 240 V330"/>
    <path d="M385 232 L420 285"/>
    <path d="M340 240 L420 365"/>
    <path d="M680 300 V240"/>
    <path d="M605 315 L570 298"/>
    <path d="M605 350 L570 375"/>
    <path d="M570 460 L640 370"/>
    <path d="M700 370 V600"/>
    <path d="M485 660 V715"/>
  </g>

  <!-- Arrow labels -->
  <g font-size="12">
    <text x="194" y="52" text-anchor="end">AddCacheMe</text>
    <text x="172" y="197">calls</text>
    <text x="402" y="82" text-anchor="middle">uses</text>
    <text x="686" y="150">checks</text>
    <text x="495" y="197" text-anchor="middle">reads, writes, queues</text>
    <text x="788" y="160">commands</text>
    <text x="252" y="480">loads, writes</text>
    <text x="305" y="290" text-anchor="end">refreshes</text>
    <text x="408" y="252">serializes</text>
    <text x="412" y="343">records</text>
    <text x="674" y="272" text-anchor="end">claims, completes</text>
    <text x="574" y="290">reads</text>
    <text x="576" y="382">records</text>
    <text x="612" y="432">runs</text>
    <text x="694" y="480" text-anchor="end">writes, notifies</text>
    <text x="491" y="692">reads, writes</text>
  </g>

  <!-- Legend -->
  <g font-size="12">
    <text x="810" y="600" font-weight="600">Legend</text>
    <rect x="810" y="612" width="22" height="14" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="840" y="624">Library component</text>
    <rect x="810" y="634" width="22" height="14" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="840" y="646">Outside the library</text>
    <path d="M810 664 H832" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="840" y="668">Calls or depends on</text>
    <path d="M810 684 H832" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="840" y="688">Library boundary</text>
  </g>
</svg>
